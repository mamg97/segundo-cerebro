name: Psychohistory Access metadata read-only
on:
  pull_request:
    paths:
      - "private-cloudflare/scripts/audit-psychohistory-access-metadata.mjs"
      - "private-cloudflare/scripts/audit-psychohistory-access-metadata.test.mjs"
      - ".github/workflows/psychohistory-access-metadata-readonly.yml"
  push:
    branches: [main]
    paths:
      - "private-cloudflare/scripts/audit-psychohistory-access-metadata.mjs"
      - "private-cloudflare/scripts/audit-psychohistory-access-metadata.test.mjs"
      - ".github/workflows/psychohistory-access-metadata-readonly.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test strict read-only metadata classification
        run: node --test private-cloudflare/scripts/audit-psychohistory-access-metadata.test.mjs
  discover-existing-account-scope:
    if: github.event_name != 'pull_request'
    needs: synthetic-security-tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_READ_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect Access app and Zero Trust organization read-only
        run: |
          set -euo pipefail
          node private-cloudflare/scripts/audit-psychohistory-access-metadata.mjs
          echo "The script does not log app AUD, team domains, account IDs, JWTs, API responses or private data."
          echo "Discovery does NOT update Worker vars, Zero Trust policies or unlock shadow 2027."
