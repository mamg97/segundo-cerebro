name: Validate iOS Health bridge

on:
  pull_request:
    paths:
      - "ios/SegundoCerebroHealthBridge/**"
      - ".github/workflows/ios-health-bridge-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate HealthKit weight freshness contract
        run: node --test ios/SegundoCerebroHealthBridge/scripts/health-weight-freshness.test.mjs
      - name: Exercise persistent sync coordination
        run: sh ios/SegundoCerebroHealthBridge/scripts/test-sync-coordinator.sh
      - name: Exercise renewal and real body SQL
        run: |
          python3 ios/SegundoCerebroHealthBridge/scripts/test_renew_free_signing.py
          node --experimental-sqlite --test private-cloudflare/src/health-body-d1.test.mjs
      - name: Build HealthKit bridge
        run: |
          xcodebuild \
            -project ios/SegundoCerebroHealthBridge/SegundoCerebroHealthBridge.xcodeproj \
            -scheme SegundoCerebroHealthBridge \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
