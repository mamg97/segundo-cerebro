name: Psychohistory 2024 isolated 23.1 holdout
on:
  pull_request:
    paths:
      - "research/psychohistory/historic23_holdout_2024.py"
      - "research/psychohistory/test_historic23_holdout_2024.py"
      - ".github/workflows/psychohistory-2024-release-holdout.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-logic-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fail closed on unsourced outcomes and future changes
        run: python3 -m unittest discover -s research/psychohistory -p test_historic23_holdout_2024.py -v
  official-outcome-sha-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin official 25.1 ZIP checksum WITHOUT reading outcomes
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 45 --max-filesize 12000000 \
             https://ucdp.uu.se/downloads/organizedviolencecy/organizedviolencecy-251-csv.zip \
             -o "$RUNNER_TEMP/cy251.zip"
          sha256sum "$RUNNER_TEMP/cy251.zip" | sed -E 's@  .*@  official 25.1 ZIP@'
          echo 'No 2024 scores computed in this preregistration probe.'
      - name: Delete ephemeral download
        if: always()
        run: rm -f "$RUNNER_TEMP/cy251.zip"
