name: Psychohistory quick-glance laboratory UI
on:
  pull_request:
    paths:
      - "app/research-lab-brief.mjs"
      - "app/research-ideas.mjs"
      - "app/research-ideas.test.mjs"
      - "app/research-lab-brief.test.mjs"
      - "app/research-futures.mjs"
      - "app/research-futures.test.mjs"
      - "app/research-futures-toolbar.test.mjs"
      - "app/research-futures-questions.mjs"
      - "app/research-futures-questions.test.mjs"
      - "app/research-futures-trees.mjs"
      - "app/research-futures-trees.test.mjs"
      - "app/research-futures-trees.css"
      - "app/research-lab-navigation.mjs"
      - "app/research-lab-navigation.test.mjs"
      - "app/research-lab-navigation.css"
      - "app/research-glossary.mjs"
      - "app/research-glossary.test.mjs"
      - "app/research-tooltip.mjs"
      - "app/research-tooltips.css"
      - "app/research-lab.html"
      - "app/research-lab.js"
      - "app/research-lab.css"
      - "app/research-lab-monochrome.css"
      - "app/research-video-studio.mjs"
      - "app/research-video-studio.css"
      - "app/research-video-studio.test.mjs"
      - "app/research-onset.test.mjs"
      - ".github/workflows/psychohistory-lab-brief-ui.yml"
  push:
    branches: [main]
    paths:
      - "app/research-lab-brief.mjs"
      - "app/research-ideas.mjs"
      - "app/research-ideas.test.mjs"
      - "app/research-lab-brief.test.mjs"
      - "app/research-futures.mjs"
      - "app/research-futures.test.mjs"
      - "app/research-futures-toolbar.test.mjs"
      - "app/research-futures-questions.mjs"
      - "app/research-futures-questions.test.mjs"
      - "app/research-futures-trees.mjs"
      - "app/research-futures-trees.test.mjs"
      - "app/research-futures-trees.css"
      - "app/research-lab.html"
      - "app/research-lab.js"
      - "app/research-lab.css"
      - "app/research-lab-monochrome.css"
      - "app/research-video-studio.mjs"
      - "app/research-video-studio.css"
      - "app/research-video-studio.test.mjs"
      - "app/research-onset.test.mjs"
      - ".github/workflows/psychohistory-lab-brief-ui.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-scientific-honesty:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check research modules and run dashboard regression tests
        run: |
          set -euo pipefail
          node --check app/research-lab.js
          node --check app/research-glossary.mjs
          node --check app/research-tooltip.mjs
          node --check app/research-lab-navigation.mjs
          node --check app/research-futures.mjs
          node --check app/research-futures-trees.mjs
          node --check app/research-futures-questions.mjs
          node --check app/research-video-studio.mjs
          node --check app/research-lab-brief.mjs
          node --check app/research-ideas.mjs
          node --test app/research-glossary.test.mjs app/research-lab-navigation.test.mjs app/research-futures-toolbar.test.mjs app/research-futures-questions.test.mjs app/research-futures.test.mjs app/research-futures-trees.test.mjs app/research-ideas.test.mjs app/research-lab-brief.test.mjs app/research-video-studio.test.mjs app/research-lab.test.mjs app/research-shadow2027.test.mjs app/research-shadow2027-inline.test.mjs app/research-onset.test.mjs
          echo "The 2027 cohort is private; tests use only fictional IDs and never fetch country probabilities."
