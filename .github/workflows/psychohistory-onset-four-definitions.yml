name: Psychohistory UCDP four onset definitions
on:
  pull_request:
    paths:
      - "research/psychohistory/onset_four_variant_semantics.py"
      - "research/psychohistory/test_onset_four_variant_semantics.py"
      - ".github/workflows/psychohistory-onset-four-definitions.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fictional-denominator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s research/psychohistory -p test_onset_four_variant_semantics.py -v
  official-four-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit old and three modern onset variants with fixed overlap
        run: |
          set -euo pipefail
          python3 research/psychohistory/onset_four_variant_semantics.py
          echo 'Modern multiple-onset bytes are observed NOW, never treated as pre-2020 timestamps.'
          echo 'No personal data, GW IDs, training, probability, score or forecast output.'
