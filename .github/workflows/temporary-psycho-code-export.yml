name: TEMP Private Research Code Handoff
on:
  push:
    branches:
      - research/psychohistory-code-export-20261017
permissions:
  contents: read
jobs:
  code-export:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Export public Python code only (NO DATA)
        run: |
          set -eu
          tar czf "$RUNNER_TEMP/psychohistory-public-code.tar.gz"             research/psychohistory/*.py
      - uses: actions/upload-artifact@v4
        with:
          name: psychohistory-public-python-code
          path: ${{ runner.temp }}/psychohistory-public-code.tar.gz
          retention-days: 1
          if-no-files-found: error
