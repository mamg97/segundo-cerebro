name: Audit production web

on:
  workflow_run:
    workflows: ["Deploy private Cloudflare app"]
    types: [completed]
  schedule:
    # Primary hourly audit plus a backup opportunity. The backup only executes
    # the browser audit when the primary schedule event was not created.
    - cron: "17 * * * *"
    - cron: "42 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

# Keep a full production audit running to completion. New schedule/deploy
# events wait behind it instead of discarding its work halfway through.
concurrency:
  group: segundo-cerebro-hourly-web-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # Allow slow upstream Ubuntu package mirrors to finish installing Playwright.
    # Bounded to 25 min; no new runs, services, permissions or paid infrastructure.
    timeout-minutes: 25
    env:
      TZ: Europe/Madrid
      AUDIT_BASE_URL: https://segundo-cerebro-web-audit.mamg97.workers.dev
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Decide whether a full audit is due
        id: cadence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const output = process.env.GITHUB_OUTPUT;
          const eventName = process.env.EVENT_NAME || "";
          const schedule = process.env.EVENT_SCHEDULE || "";

          // A failed Chromium audit can still be a real audit attempt. The
          // backup slot must not repeat it just to turn an expected red CI green.
          // Bounded Chromium timeouts can finish in 90-120 seconds after hundreds
          // of checks; only earlier aborts remain eligible for recovery.
          function completedChromiumAudit(run, chromiumStep) {
            if (run.status !== "completed") return false;
            if (chromiumStep?.conclusion === "success") return true;
            if (chromiumStep?.conclusion !== "failure") return false;
            const started = Date.parse(chromiumStep.started_at || "");
            const finished = Date.parse(chromiumStep.completed_at || "");
            return Number.isFinite(started) && Number.isFinite(finished) &&
              finished - started >= 90_000;
          }

          async function main() {
            if (eventName !== "schedule" || schedule === "17 * * * *") {
              fs.appendFileSync(output, "run_audit=true\n");
              fs.appendFileSync(output, "reason=primary-or-explicit\n");
              return;
            }

            try {
              const response = await fetch(
                `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/web-audit.yml/runs?event=schedule&per_page=20`,
                {
                  headers: {
                    Accept: "application/vnd.github+json",
                    Authorization: `Bearer ${process.env.GH_TOKEN}`,
                    "X-GitHub-Api-Version": "2022-11-28"
                  }
                }
              );
              if (!response.ok) throw new Error(`GitHub API ${response.status}`);
              const payload = await response.json();
              const cutoff = Date.now() - 40 * 60 * 1000;
              const currentId = Number(process.env.CURRENT_RUN_ID);
              const recentRuns = (payload.workflow_runs || []).filter((run) => {
                if (Number(run.id) === currentId) return false;
                const created = Date.parse(run.created_at || "");
                return Number.isFinite(created) && created >= cutoff &&
                  run.status !== "cancelled" && run.conclusion !== "cancelled";
              });

              let fullAuditCovered = false;
              for (const run of recentRuns) {
                const jobsResponse = await fetch(
                  `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${run.id}/jobs?per_page=100`,
                  {
                    headers: {
                      Accept: "application/vnd.github+json",
                      Authorization: `Bearer ${process.env.GH_TOKEN}`,
                      "X-GitHub-Api-Version": "2022-11-28"
                    }
                  }
                );
                if (!jobsResponse.ok) throw new Error("GitHub jobs inspection failed");
                const jobs = await jobsResponse.json();
                const chromiumStep = (jobs.jobs || []).flatMap((job) => job.steps || [])
                  .find((step) => step.name === "Navigate and audit production");

                if (run.status === "queued" || run.status === "in_progress") {
                  if (chromiumStep && !["skipped", "failure", "cancelled"].includes(chromiumStep.conclusion)) {
                    fullAuditCovered = true;
                    break;
                  }
                  continue;
                }

                if (completedChromiumAudit(run, chromiumStep)) {
                  fullAuditCovered = true;
                  break;
                }
              }

              fs.appendFileSync(output, `run_audit=${fullAuditCovered ? "false" : "true"}\n`);
              fs.appendFileSync(output, `reason=${fullAuditCovered ? "full-audit-covered" : "full-audit-missing"}\n`);
            } catch (error) {
              // Fail open: if cadence inspection itself fails, run the browser audit.
              fs.appendFileSync(output, "run_audit=true\n");
              fs.appendFileSync(output, "reason=cadence-check-failed\n");
              console.error("AUDIT_CADENCE_INSPECTION_FAILED");
            }
          }

          main().catch((error) => {
            fs.appendFileSync(output, "run_audit=true\n");
            fs.appendFileSync(output, "reason=cadence-check-crashed\n");
            console.error("AUDIT_CADENCE_CHECK_FAILED");
          });
          NODE

      - name: Backup schedule heartbeat
        if: ${{ github.event_name == 'schedule' && steps.cadence.outputs.run_audit != 'true' }}
        run: echo "Primary hourly audit already exists; backup slot stays lightweight."

      - uses: actions/checkout@v4
        if: ${{ steps.cadence.outputs.run_audit == 'true' }}

      - uses: actions/setup-node@v4
        if: ${{ steps.cadence.outputs.run_audit == 'true' }}
        with:
          node-version: "22"

      # Independently check the real workers.dev boundary from an anonymous
      # GitHub runner BEFORE minting any OIDC service/audit credentials.
      # A public 200 or a network failure MUST fail, never be treated as private.
      - name: Verify PSICOHISTORIA anonymous access denied in production
        if: ${{ steps.cadence.outputs.run_audit == 'true' }}
        run: node private-cloudflare/scripts/audit-psychohistory-anonymous.mjs

      - name: Install audit browser
        if: ${{ steps.cadence.outputs.run_audit == 'true' }}
        working-directory: private-cloudflare
        run: |
          npm install
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Mint short-lived GitHub OIDC token
        if: ${{ steps.cadence.outputs.run_audit == 'true' }}
        shell: bash
        run: |
          RESPONSE="$(curl --fail --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=segundo-cerebro-web-audit")"
          TOKEN="$(printf '%s' "$RESPONSE" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const parsed = JSON.parse(input);
              if (!parsed.value) process.exit(2);
              process.stdout.write(parsed.value);
            });
          ')"
          echo "::add-mask::$TOKEN"
          echo "AUDIT_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Check live weekly nutrition source parity
        id: nutrition_parity
        if: ${{ steps.cadence.outputs.run_audit == 'true' }}
        # Preserve the failed outcome, but still run Chromium to diagnose production.
        continue-on-error: true
        working-directory: private-cloudflare
        run: node scripts/audit-nutrition-live-parity.mjs

      - name: Navigate and audit production
        if: ${{ steps.cadence.outputs.run_audit == 'true' }}
        working-directory: private-cloudflare
        run: node scripts/web-audit.mjs

      # A failed nutrition parity read is still a failed audit, even when
      # Chromium succeeds. Never certify a partially verified production state.
      - name: Preserve nutrition parity failure
        if: ${{ always() && steps.cadence.outputs.run_audit == 'true' && steps.nutrition_parity.outcome == 'failure' }}
        run: exit 1
