name: Public repository privacy guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run synthetic privacy tests
        run: python3 -m unittest discover -s scripts -p test_privacy_guard.py
      - name: Inspect added content and changed filenames
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE="$BEFORE_SHA"
          else
            BASE="$(git rev-parse HEAD^)"
          fi
          if ! [[ "$BASE" =~ ^[0-9a-fA-F]{40}$ ]] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "Base SHA unavailable; do not skip privacy scan" >&2
            exit 1
          fi
          python3 scripts/privacy_guard.py "$BASE" "$CURRENT_SHA"
