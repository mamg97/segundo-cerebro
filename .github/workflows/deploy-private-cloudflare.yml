name: Deploy private Cloudflare app
# Auto-deploy verification marker · Finance movement tabs v0.40.11

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "core/**"
      - "private-cloudflare/src/**"
      - "private-cloudflare/scripts/**"
      - "private-cloudflare/package.json"
      - "private-cloudflare/wrangler.bootstrap.jsonc"
      - "private-cloudflare/wrangler.health-ingest.jsonc"
      - "private-cloudflare/wrangler.objects-ingest.jsonc"
      - "private-cloudflare/wrangler.midas-ingest.jsonc"
      - "private-cloudflare/wrangler.shopping-reminders.jsonc"
      - "private-cloudflare/wrangler.web-audit.jsonc"
      - ".github/workflows/deploy-private-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: segundo-cerebro-private-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: private-cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Confirm deployment run is current main
        id: head
        shell: bash
        run: |
          git fetch origin main --depth=1
          latest="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" == "$latest" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale production deploy for $GITHUB_SHA; current main is $latest"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Validate JavaScript
        run: |
          node --check ../app/app.js
          node --check ../app/demo-mode.js
          node --check ../app/pantry.js
          node --check ../app/objects.js
          node --check ../app/projects.js
          node --check ../app/events.js
          node --check ../app/adherence.js
          node --check ../app/progress-ring.js
          node --check ../app/midas-lab.js
          node ../app/midas-lab.test.mjs
          node --check src/index.js
          node --check src/delta.js

          node --check src/pantry.js
          node --check src/shopping-sync.js
          node --check scripts/configure-shopping-reminders.mjs
          node --check scripts/web-audit.mjs
          node --check src/objects.js
          node --check src/objects-images.js
          node --check src/objects-media-d1.js
          node --check src/projects.js
          node --check src/events.js
          node --check src/events-sheet.js
          node --check src/adherence.js
          node --check src/icloud-calendar.js
          node --check src/health-ingest.js
          node --check src/objects-ingest.js
          node --check src/midas.js
          node --check src/midas-ingest.js
          node --check src/shopping-reminders-ingest.js
          node --check src/web-audit-gateway.js

      - name: Run tests
        run: npm test

      - name: Verify MIDAS report adapter
        run: node --test tests/midas.test.mjs

      - name: Build private bundle
        run: npm run build

      - name: Confirm no private files enter build
        run: |
          test ! -e dist/.private
          test -f dist/app/index.html
          test -f dist/private-config.js
          grep -q "__SECOND_BRAIN_REMOTE__" dist/private-config.js
          grep -q 'src="../private-config.js"' dist/app/index.html

      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deploy skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets."
          fi

      - name: Deploy production Worker
        if: steps.cloudflare.outputs.configured == 'true' && steps.head.outputs.current == 'true'
        run: npx wrangler deploy --config wrangler.bootstrap.jsonc

      - name: Deploy Health ingest Worker
        if: steps.cloudflare.outputs.configured == 'true' && steps.head.outputs.current == 'true'
        run: npx wrangler deploy --config wrangler.health-ingest.jsonc

      - name: Deploy Objects ingest Worker
        if: steps.cloudflare.outputs.configured == 'true' && steps.head.outputs.current == 'true'
        run: npx wrangler deploy --config wrangler.objects-ingest.jsonc

      - name: Deploy MIDAS ingest Worker
        if: steps.cloudflare.outputs.configured == 'true' && steps.head.outputs.current == 'true'
        run: npx wrangler deploy --config wrangler.midas-ingest.jsonc

      - name: Deploy Shopping Reminders ingest Worker
        if: steps.cloudflare.outputs.configured == 'true' && steps.head.outputs.current == 'true'
        run: npx wrangler deploy --config wrangler.shopping-reminders.jsonc

      - name: Deploy Web audit gateway
        if: steps.cloudflare.outputs.configured == 'true' && steps.head.outputs.current == 'true'
        run: npx wrangler deploy --config wrangler.web-audit.jsonc

      - name: Explain skipped deployment
        if: steps.cloudflare.outputs.configured != 'true'
        run: |
          echo "Validation and build passed, but production deploy was skipped because Cloudflare credentials are not configured in GitHub Actions."

      - name: Explain stale deployment skip
        if: steps.cloudflare.outputs.configured == 'true' && steps.head.outputs.current != 'true'
        run: |
          echo "Validation and build passed, but this run is older than the current main HEAD, so production deployment was skipped."
