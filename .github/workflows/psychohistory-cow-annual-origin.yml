# Retrospective rule-only analysis, NOT official system2024 CSV verification.
# Source bytes fetched to ephemeral runner, no exported country rows.
name: Psychohistory COW annual Jan1 roster gate
on:
  pull_request:
    paths:
      - "research/psychohistory/cow_annual_origin_gate.py"
      - "research/psychohistory/test_cow_annual_origin_gate.py"
      - ".github/workflows/psychohistory-cow-annual-origin.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  annual-country-origin-leakage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch single public historical COW state interval source
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 \
            --max-time 45 --max-filesize 90000 \
            --output "$RUNNER_TEMP/cow_states_2024.csv" \
            'https://raw.githubusercontent.com/brentonk/us_diplomatic_missions/0dda0ef93b7958f67c79031c1695dd9e5408a62c/input/cow_statelist2024.csv'
      - name: Replay documented any-time-year rule, compare with January first
        shell: bash
        run: |
          set -euo pipefail
          python3 research/psychohistory/cow_annual_origin_gate.py \
            --cow-states "$RUNNER_TEMP/cow_states_2024.csv" \
            --cow-sha256 722153b45eda9c39826a04aab80ca7b29a8b1cfdfe5d92714503420555675484 \
            --year 1990 --year 2002 --year 2006 --year 2008 \
            --year 2011 --year 2020 --year 2024 --year 2025
          echo 'No direct official system2024 CSV downloaded; this is documented rule replay.'
          echo 'No source as-of authentication, no UCDP labels, no prediction issued.'
      - name: Remove temporary public country rows
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/cow_states_2024.csv"
