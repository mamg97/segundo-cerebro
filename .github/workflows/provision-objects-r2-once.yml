name: Provision Objects R2 once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/provision-objects-r2-once.yml"

permissions:
  contents: read

concurrency:
  group: segundo-cerebro-objects-r2-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: private-cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Provision private Objects R2 bucket
        shell: bash
        run: |
          set -euo pipefail
          bucket="segundo-cerebro-private-assets"
          if npx wrangler r2 bucket info "$bucket" >/tmp/r2-info-before.log 2>&1; then
            echo "Bucket already exists."
          else
            npx wrangler r2 bucket create "$bucket"
          fi
          npx wrangler r2 bucket info "$bucket"

      - name: Build private bundle
        run: npm run build

      - name: Deploy production Worker with OBJECTS_MEDIA
        run: npx wrangler deploy --config wrangler.bootstrap.jsonc
