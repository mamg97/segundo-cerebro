name: Psychohistory AV-085 archived monthly GED to annual CY bridge
on:
  pull_request:
    paths:
      - 'research/psychohistory/ged_monthly_cy_bridge.py'
      - 'research/psychohistory/test_ged_monthly_cy_bridge.py'
      - 'research/psychohistory/ged_monthly_cy_diagnostics.py'
      - 'research/psychohistory/test_ged_monthly_cy_diagnostics.py'
      - 'research/psychohistory/ged_cy_source_contract.json'
      - '.github/workflows/psychohistory-ged-monthly-cy-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monthly-bridge-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test old features vs later annual outcomes and provenance controls
        run: |
          set -euo pipefail
          python3 -m py_compile research/psychohistory/ged_monthly_cy_bridge.py
          python3 -m unittest discover -s research/psychohistory -p 'test_ged_monthly_cy*.py' -v
          echo 'No country risk, predictions or GED event identities emitted.'
  discover-official-monthly-vintages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download GED23.1 and GED24.1 archival releases ephemerally
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 --max-time 110 \
            --max-filesize 90000000 \
            https://ucdp.uu.se/downloads/ged/ged231-csv.zip -o "$RUNNER_TEMP/ged23.zip"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 --max-time 110 \
            --max-filesize 90000000 \
            https://ucdp.uu.se/downloads/ged/ged241-csv.zip -o "$RUNNER_TEMP/ged24.zip"
      - name: Verify exact official codebook bytes and source contract
        run: |
          python3 - <<'PY'
          import hashlib,json,urllib.request
          contract=json.load(open('research/psychohistory/ged_cy_source_contract.json'))
          assert contract['historical_bytes_availability_verified'] is False
          for item in contract['codebooks']:
              with urllib.request.urlopen(item['url'],timeout=60) as response:
                  body=response.read(2000001)
              assert len(body)==item['bytes'] and body.startswith(b'%PDF-')
              assert hashlib.sha256(body).hexdigest()==item['sha256']
          print('Four official codebooks match pinned bytes; historical issue availability unverified.')
          PY
      - name: Discover archive byte SHA without scoring or issuing forecasts
        run: |
          set -euo pipefail
          python3 research/psychohistory/ged_monthly_cy_bridge.py --ged "$RUNNER_TEMP/ged23.zip" --discover
          python3 research/psychohistory/ged_monthly_cy_bridge.py --ged "$RUNNER_TEMP/ged24.zip" --discover
          echo 'This discovery cannot authenticate historical release timestamps.'
      - name: Download exact pinned historical CY training and scoring releases
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 --max-time 110 --max-filesize 20000000 \
            https://ucdp.uu.se/downloads/organizedviolencecy/organizedviolencecy_v23_1.xlsx -o "$RUNNER_TEMP/cy23.xlsx"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 --max-time 110 --max-filesize 20000000 \
            https://ucdp.uu.se/downloads/organizedviolencecy/organizedviolencecy-251-csv.zip -o "$RUNNER_TEMP/cy25.zip"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 --max-time 110 --max-filesize 20000000 \
            https://ucdp.uu.se/downloads/organizedviolencecy/organizedviolencecy-241-csv.zip -o "$RUNNER_TEMP/cy24.zip"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 --max-time 110 --max-filesize 20000000 \
            https://ucdp.uu.se/downloads/organizedviolencecy/organizedviolencecy-261-csv.zip -o "$RUNNER_TEMP/cy26.zip"
      - name: Evaluate OLD GED incident timing vs OLD CY roster and NEW CY outcomes
        run: |
          set -euo pipefail
          python3 research/psychohistory/ged_monthly_cy_bridge.py \
            --ged "$RUNNER_TEMP/ged23.zip" --cy-old "$RUNNER_TEMP/cy23.xlsx" --cy-new "$RUNNER_TEMP/cy25.zip" --cutoff 2022
          python3 research/psychohistory/ged_monthly_cy_bridge.py \
            --ged "$RUNNER_TEMP/ged24.zip" --cy-old "$RUNNER_TEMP/cy24.zip" --cy-new "$RUNNER_TEMP/cy26.zip" --cutoff 2023
          python3 research/psychohistory/ged_monthly_cy_diagnostics.py \
            --ged "$RUNNER_TEMP/ged23.zip" --cy-old "$RUNNER_TEMP/cy23.xlsx" --cy-new "$RUNNER_TEMP/cy25.zip" --cutoff 2022
          python3 research/psychohistory/ged_monthly_cy_diagnostics.py \
            --ged "$RUNNER_TEMP/ged24.zip" --cy-old "$RUNNER_TEMP/cy24.zip" --cy-new "$RUNNER_TEMP/cy26.zip" --cutoff 2023
          echo 'RETROSPECTIVE and post-hoc! CY is GED-derived within-borders geography; incident counts != annual threshold target. No forecasts issued.'
      - name: Delete ephemeral archive bytes
        if: always()
        run: rm -f "$RUNNER_TEMP/ged23.zip" "$RUNNER_TEMP/ged24.zip" "$RUNNER_TEMP/cy23.xlsx" "$RUNNER_TEMP/cy25.zip" "$RUNNER_TEMP/cy24.zip" "$RUNNER_TEMP/cy26.zip"
