# Outcome-blind state systems. NEVER convert COW codes to UCDP GW codes.
# Source public copies fetched to ephemeral runner; no raw files/artifacts saved.
name: Audit COW 2024 versus GW 2020 population systems
on:
  pull_request:
    paths:
      - "research/psychohistory/cow_gw_denominator_bridge.py"
      - "research/psychohistory/test_cow_gw_denominator_bridge.py"
      - ".github/workflows/psychohistory-cow-gw-denominator.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-roster-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download publicly archived membership files to runner only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cow-gw-membership"
          root="https://raw.githubusercontent.com/brentonk/us_diplomatic_missions/0dda0ef93b7958f67c79031c1695dd9e5408a62c/input"
          for spec in 'cow_statelist2024.csv:cow.csv' 'ksgmdw.txt:gw.txt' 'microstates.txt:micro.txt'; do
            IFS=: read -r remote localfile <<< "$spec"
            curl --proto '=https' --tlsv1.2 --fail --location --retry 2 \
              --max-time 50 --max-filesize 90000 \
              --output "$RUNNER_TEMP/cow-gw-membership/$localfile" \
              "$root/$remote"
          done
      - name: Compare only aggregated population counts, NEVER incident labels
        shell: bash
        run: |
          set -euo pipefail
          python3 research/psychohistory/cow_gw_denominator_bridge.py \
            --cow "$RUNNER_TEMP/cow-gw-membership/cow.csv" \
            --gw "$RUNNER_TEMP/cow-gw-membership/gw.txt" \
            --micro "$RUNNER_TEMP/cow-gw-membership/micro.txt" \
            --gw-sha256 70ba63cd8a936a25a701be5daffa1105411da5298ff890bf4bc27ed688892b2b \
            --month 2020-12 --month 2024-12 --month 2025-01
          echo 'A 2025-published COW 2024 retrospective roster does NOT license a 2024 as-of forecast.'
          echo 'COW country codes are NOT equivalent to GW/UCDP country_id.'
      - name: Remove raw source files in all cases
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/cow-gw-membership"
