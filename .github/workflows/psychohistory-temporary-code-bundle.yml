name: Temporary psychohistory source reproduction bundle
on:
  pull_request:
    paths:
      - '.github/workflows/psychohistory-temporary-code-bundle.yml'
permissions:
  contents: read
jobs:
  package-code:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Package only public source files
        uses: actions/upload-artifact@v4
        with:
          name: psychohistory-source-only-reproduction
          path: |
            research/psychohistory/ged_reemergence.py
            research/psychohistory/ged_monthly_incidence.py
            research/psychohistory/ged_event_context.py
            research/psychohistory/ucdp_onset.py
          retention-days: 1
