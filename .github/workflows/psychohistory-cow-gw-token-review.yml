# Token matching is NOT authoritative COW/GW/UCDP geographical concordance.
# Download public source bytes ephemerally; only publish aggregate statuses.
name: Audit unapproved COW GW textual crosswalk candidates
on:
  pull_request:
    paths:
      - "research/psychohistory/cow_gw_token_review.py"
      - "research/psychohistory/test_cow_gw_token_review.py"
      - ".github/workflows/psychohistory-cow-gw-token-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crosswalk-proposals-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exact observed public source revisions to temporary runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/psycho-crosswalk"
          root="https://raw.githubusercontent.com/brentonk/us_diplomatic_missions/0dda0ef93b7958f67c79031c1695dd9e5408a62c/input"
          for spec in 'cow_statelist2024.csv:cow.csv' 'ksgmdw.txt:gw.txt' 'microstates.txt:micro.txt'; do
            IFS=: read -r remote filename <<< "$spec"
            curl --proto '=https' --tlsv1.2 --fail --location --retry 2 \
              --max-time 45 --max-filesize 90000 \
              --output "$RUNNER_TEMP/psycho-crosswalk/$filename" "$root/$remote"
          done
      - name: Print only aggregate state-token crosswalk candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 research/psychohistory/cow_gw_token_review.py \
            --cow "$RUNNER_TEMP/psycho-crosswalk/cow.csv" \
            --gw "$RUNNER_TEMP/psycho-crosswalk/gw.txt" \
            --micro "$RUNNER_TEMP/psycho-crosswalk/micro.txt" \
            --cow-sha256 722153b45eda9c39826a04aab80ca7b29a8b1cfdfe5d92714503420555675484 \
            --gw-sha256 70ba63cd8a936a25a701be5daffa1105411da5298ff890bf4bc27ed688892b2b \
            --micro-sha256 02b6cc749405b744258c3b314b668fa6438fbb7d869c3e7be4bd2cb6da2c5288 \
            --month 2019-12 --month 2020-12 --month 2024-12 --month 2025-01
          echo 'Token proposals are NOT authorized COW-to-GW mappings, as-of data, or UCDP target labels.'
      - name: Delete ephemeral country lists even on failure
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/psycho-crosswalk"
