# Independent issue-day population diagnostic, not a vintage-correct model input.
name: Psychohistory issue-day roster lookahead audit
on:
  pull_request:
    paths:
      - "research/psychohistory/issue_day_state_roster_gate.py"
      - "research/psychohistory/test_issue_day_state_roster_gate.py"
      - ".github/workflows/psychohistory-issue-day-roster.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  issue-day-versus-full-month:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned public state-system archives into ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-roster"
          root="https://raw.githubusercontent.com/brentonk/us_diplomatic_missions/0dda0ef93b7958f67c79031c1695dd9e5408a62c/input"
          for spec in 'cow_statelist2024.csv:cow.csv' 'ksgmdw.txt:gw.txt' 'microstates.txt:micro.txt'; do
            IFS=: read -r source localfile <<< "$spec"
            curl --proto '=https' --tlsv1.2 --fail --location --retry 2 \
              --max-time 45 --max-filesize 90000 \
              --output "$RUNNER_TEMP/issue-roster/$localfile" "$root/$source"
          done
      - name: Compare retrospective first-day membership and full-month rules
        shell: bash
        run: |
          set -euo pipefail
          python3 research/psychohistory/issue_day_state_roster_gate.py \
            --cow "$RUNNER_TEMP/issue-roster/cow.csv" \
            --gw "$RUNNER_TEMP/issue-roster/gw.txt" \
            --micro "$RUNNER_TEMP/issue-roster/micro.txt" \
            --cow-sha256 722153b45eda9c39826a04aab80ca7b29a8b1cfdfe5d92714503420555675484 \
            --gw-sha256 70ba63cd8a936a25a701be5daffa1105411da5298ff890bf4bc27ed688892b2b \
            --micro-sha256 02b6cc749405b744258c3b314b668fa6438fbb7d869c3e7be4bd2cb6da2c5288 \
            --month 2006-06 --month 2011-07 --month 2020-12 --month 2024-12 --month 2025-01
          echo 'Public output: aggregate geometry only; historical as-of flags remain false.'
      - name: Delete raw country source bytes
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/issue-roster"
