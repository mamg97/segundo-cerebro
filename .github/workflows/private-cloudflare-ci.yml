name: Validate private Cloudflare app

on:
  pull_request:
    paths:
      - "app/**"
      - "core/**"
      - "private-cloudflare/**"
      - "objects-chatgpt-bridge/**"
      - "docs/objects-chatgpt-action.openapi.yaml"
      - ".github/workflows/private-cloudflare-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: private-cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - run: node --check ../app/app.js

      - run: node --check ../app/demo-mode.js

      - run: node --check ../app/pantry.js

      - run: node --check ../app/objects.js

      - run: node --check ../app/projects.js

      - run: node --check ../app/events.js

      - run: node --check ../app/adherence.js

      - run: node --check ../app/progress-ring.js
      - run: node --check ../app/midas-lab.js
      - run: node ../app/midas-lab.test.mjs
      - run: node ../app/progress-ring.test.mjs

      - run: node --check src/index.js

      - run: node --check src/pantry.js

      - run: node --check src/shopping-sync.js

      - run: node --check scripts/configure-shopping-reminders.mjs

      - run: node --check src/objects.js
      - run: node --check src/objects-images.js
      - run: node --check src/objects-bridge-auth.js

      - name: Validate ChatGPT bridge syntax
        working-directory: objects-chatgpt-bridge
        run: node --check server.mjs

      - name: Test ChatGPT bridge
        working-directory: objects-chatgpt-bridge
        run: npm test

      - run: node --check src/projects.js

      - run: node --check src/events.js

      - run: node --check src/adherence.js

      - run: node --check src/icloud-calendar.js

      - run: node --check src/health-ingest.js

      - run: node --check src/shopping-reminders-ingest.js

      - run: npm test

      - run: npx wrangler deploy --dry-run --config wrangler.health-ingest.jsonc

      - run: npx wrangler deploy --dry-run --config wrangler.shopping-reminders.jsonc

      - run: npm run build

      - run: npx wrangler deploy --dry-run --config wrangler.bootstrap.jsonc

      - name: Confirm no private files enter build
        run: |
          test ! -e dist/.private
          test -f dist/app/index.html
          test -f dist/private-config.js
          grep -q "__SECOND_BRAIN_REMOTE__" dist/private-config.js
          grep -q 'src="../private-config.js"' dist/app/index.html
